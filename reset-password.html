<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Reset Password — ModulKita</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--ink:#172033;--muted:#667085;--line:#e4e7ec;--soft:#eef2ff;--ok:#067647;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#eef2ff,#faf5ff 50%,#ecfeff);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.card{width:min(100%,470px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 24px 60px rgba(30,41,59,.12)}
.logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:950;font-size:25px;margin-bottom:14px}
h1{margin:0 0 7px;font-size:28px}
p{color:var(--muted);line-height:1.55}
label{display:block;font-size:13px;font-weight:850;margin:13px 0 6px;color:#344054}
input{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px;font:inherit;outline:none}
input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #eef2ff}
.btn{width:100%;border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:900;cursor:pointer;margin-top:12px}
.primary{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff}
.ghost{background:#fff;border:1px solid var(--line);color:#344054}
.msg{display:none;border-radius:11px;padding:10px 12px;margin:12px 0;font-size:13px;line-height:1.45}
.msg.show{display:block}.msg.ok{background:#ecfdf3;color:var(--ok)}.msg.bad{background:#fef3f2;color:var(--bad)}.msg.warn{background:#fffaeb;color:#b54708}
.tip{background:var(--soft);border-radius:12px;padding:11px 12px;font-size:12.5px;color:#3730a3;line-height:1.5}
.small{font-size:12px;color:var(--muted)}
.strength{height:7px;background:#eef2f6;border-radius:999px;overflow:hidden;margin-top:8px}.strength span{display:block;height:100%;width:0;background:#f59e0b;transition:.2s}
</style>
</head>
<body>
<div class="card">
  <div class="logo">M</div>
  <h1 id="pageTitle">Buat Password Baru</h1>
  <p id="pageDesc">Masukkan password baru untuk akun ModulKita Anda.</p>

  <div id="status" class="msg show warn">Memeriksa link pemulihan…</div>

  <div id="formWrap" style="display:none">
    <div class="tip">Password lama tidak dapat ditampilkan kembali. Demi keamanan, Anda membuat password baru.</div>

    <label>Password Baru</label>
    <input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" oninput="updateStrength()">
    <div class="strength"><span id="strengthBar"></span></div>
    <div id="strengthText" class="small" style="margin-top:5px"></div>

    <label>Ulangi Password Baru</label>
    <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Ketik ulang password">

    <button id="saveBtn" class="btn primary" onclick="savePassword()">Simpan Password Baru</button>
  </div>

  <button class="btn ghost" onclick="location.href='index.html'">Kembali ke ModulKita</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const cfg=window.MODULKITA_CONFIG||{};
let sb=null,ready=false;
const $=id=>document.getElementById(id);

function show(text,type='warn'){
 const el=$('status');el.textContent=text;el.className='msg show '+type;
}
function updateStrength(){
 const p=$('newPassword').value||'';
 let score=0;
 if(p.length>=6)score++;
 if(p.length>=10)score++;
 if(/[A-Z]/.test(p)&&/[a-z]/.test(p))score++;
 if(/\d/.test(p))score++;
 if(/[^A-Za-z0-9]/.test(p))score++;
 const pct=[0,22,45,68,84,100][score];
 $('strengthBar').style.width=pct+'%';
 $('strengthBar').style.background=score<=1?'#ef4444':score<=3?'#f59e0b':'#22c55e';
 $('strengthText').textContent=p?(['','Lemah','Cukup','Cukup','Kuat','Sangat kuat'][score]||''):'';
}
async function init(){
 if(!cfg.supabaseUrl||!cfg.supabasePublishableKey){
   return show('Konfigurasi Supabase belum tersedia. Hubungi admin ModulKita.','bad');
 }
 sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{
   auth:{detectSessionInUrl:true,persistSession:true}
 });

 const mode=new URLSearchParams(location.search).get('mode');
 if(mode==='change'){
   $('pageTitle').textContent='Ganti Password';
   $('pageDesc').textContent='Buat password baru untuk akun ModulKita yang sedang Anda gunakan.';
 }

 sb.auth.onAuthStateChange((event,session)=>{
   if((event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')&&session){
     ready=true;$('formWrap').style.display='block';
     show(mode==='change'?'Akun terverifikasi. Silakan buat password baru.':'Link reset valid. Silakan buat password baru.','ok');
   }
 });

 try{
   const params=new URLSearchParams(location.search);
   const code=params.get('code');
   let {data:{session}}=await sb.auth.getSession();

   // Dukungan alur PKCE jika recovery URL membawa ?code=
   if(!session && code){
     const {data,error}=await sb.auth.exchangeCodeForSession(code);
     if(!error)session=data.session;
   }

   if(session){
     ready=true;$('formWrap').style.display='block';
     show(mode==='change'?'Akun terverifikasi. Silakan buat password baru.':'Link reset valid. Silakan buat password baru.','ok');
   }else{
     show('Link reset tidak valid, sudah kedaluwarsa, atau belum diproses. Minta link reset baru dari halaman masuk ModulKita.','bad');
   }
 }catch(err){
   show(err?.message||'Gagal memproses link reset password.','bad');
 }
}

async function savePassword(){
 if(!ready||!sb)return show('Sesi reset password belum siap. Buka kembali link dari email.','bad');
 const p=$('newPassword').value;
 const c=$('confirmPassword').value;
 if(p.length<6)return show('Password minimal 6 karakter.','bad');
 if(p!==c)return show('Konfirmasi password tidak sama.','bad');

 $('saveBtn').disabled=true;
 show('Menyimpan password baru…','warn');
 try{
   const {error}=await sb.auth.updateUser({password:p});
   if(error)throw error;
   show('Password berhasil diubah. Anda akan diarahkan ke halaman masuk.','ok');
   await sb.auth.signOut();
   setTimeout(()=>location.href='index.html?reset=success',1000);
 }catch(err){
   show(err?.message||'Gagal mengganti password. Coba lagi.','bad');
   $('saveBtn').disabled=false;
 }
}
init();
</script>
</body>
</html>
