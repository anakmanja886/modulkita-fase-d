<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ModulKita Premium</title>
<style>
:root{--p:#4338ca;--p2:#7c3aed;--line:#e4e7ec;--bg:#f7f8fc;--ink:#172033;--muted:#667085;--ok:#067647;--warn:#b54708;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial;color:var(--ink)}button{font:inherit}
.top{background:linear-gradient(135deg,#312e81,#4338ca,#7c3aed);color:#fff;padding:15px 18px}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;font-size:18px}
.wrap{max-width:1100px;margin:auto;padding:20px 16px 50px}.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:850;cursor:pointer}.p{background:var(--p);color:#fff}.g{background:#eef2ff;color:#3730a3}.r{background:#fff1f3;color:#c01048}.w{background:#fffaeb;color:#b54708}.refresh{background:#fff;border:1px solid var(--line);color:#344054}
.msg{padding:11px 12px;border-radius:11px;background:#fffaeb;color:#b54708;margin-bottom:14px}.hidden{display:none}.section{margin:24px 0}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionHead h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(16,24,40,.05)}.card h3{margin:0 0 3px;font-size:16px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 9px;font-size:12px;margin-top:11px}.kv b{color:#475467}.chip{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2ff;color:#3730a3}.chip.pending{background:#fffaeb;color:#b54708}.chip.approved{background:#ecfdf3;color:#067647}.chip.rejected{background:#fef3f2;color:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{background:#fff;border:1px dashed #d0d5dd;border-radius:14px;padding:18px;color:#667085;text-align:center}.count{font-size:12px;color:#667085}
@media(max-width:720px){.grid{grid-template-columns:1fr}.kv{grid-template-columns:95px 1fr}.topin{align-items:flex-start}.topin>div:last-child{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}}
</style></head>
<body>
<div class="top"><div class="topin"><div class="brand">Admin ModulKita Premium</div><div><button class="btn g" onclick="location.href='index.html'">Beranda</button> <button class="btn r" onclick="logout()">Keluar</button></div></div></div>
<main class="wrap">
  <div id="msg" class="msg">Memeriksa akses admin…</div>
  <section id="adminArea" class="hidden">
    <div class="section">
      <div class="sectionHead"><div><h2>Permintaan Pembelian</h2><div id="reqCount" class="count"></div></div><button class="btn refresh" onclick="loadAll()">↻ Muat Ulang</button></div>
      <div id="requests" class="grid"></div>
    </div>
    <div class="section">
      <div class="sectionHead"><div><h2>Pengguna</h2><div id="userCount" class="count"></div></div></div>
      <div id="users" class="grid"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const cfg=window.MODULKITA_CONFIG||{},$=x=>document.getElementById(x);let sb,user;
function show(t){$('msg').textContent=t}
function planLabel(p){return p==='premium_30'?'Premium 30 Hari':p==='premium_year'?'Premium 1 Tahun':p==='lifetime'?'Lifetime':'Demo'}
async function init(){
 if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)return show('Layanan akun belum siap.');
 sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
 const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='index.html';user=session.user;
 const {data:p}=await sb.from('modulkita_profiles').select('role').eq('id',user.id).single();if(!p||p.role!=='admin')return show('Akses ditolak. Akun ini bukan admin.');
 $('adminArea').classList.remove('hidden');show('Akses admin aktif.');loadAll()
}
async function loadAll(){await loadRequests();await loadUsers()}
async function loadRequests(){
 const {data,error}=await sb.rpc('modulkita_admin_list_purchase_requests');if(error)return show(error.message);
 $('reqCount').textContent=`${(data||[]).length} permintaan`;
 $('requests').innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="card">
   <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h3>${x.full_name||'Tanpa nama'}</h3><div class="muted">${x.email||'-'}</div></div><span class="chip ${x.status}">${x.status.toUpperCase()}</span></div>
   <div class="kv"><b>Paket</b><span>${planLabel(x.package)}</span><b>Waktu</b><span>${new Date(x.created_at).toLocaleString('id-ID')}</span><b>WhatsApp</b><span>${x.phone||'-'}</span><b>Referensi</b><span>${x.transaction_ref||'-'}</span></div>
   <div class="actions">${x.status==='pending'?`<button class="btn p" onclick="approve(${x.id},'${x.user_id}','${x.package}')">Setujui</button><button class="btn r" onclick="setReq(${x.id},'rejected')">Tolak</button>`:`<button class="btn g" disabled>${x.status==='approved'?'Sudah disetujui':'Sudah ditolak'}</button>`}</div>
 </div>`).join(''):'<div class="empty">Belum ada permintaan pembelian.</div>'
}
async function loadUsers(){
 const {data,error}=await sb.rpc('modulkita_admin_list_users');if(error)return show(error.message);
 $('userCount').textContent=`${(data||[]).length} pengguna`;
 $('users').innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="card">
   <div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${x.full_name||'Tanpa nama'}</h3><div class="muted">${x.email||'-'}</div></div><span class="chip">${x.role==='admin'?'ADMIN':planLabel(x.plan)}</span></div>
   <div class="kv"><b>Paket</b><span>${planLabel(x.plan)}</span><b>Aktif s.d.</b><span>${x.plan==='lifetime'?'Lifetime':x.access_until?new Date(x.access_until).toLocaleDateString('id-ID'):'-'}</span><b>Role</b><span>${x.role}</span></div>
   <div class="actions"><button class="btn g" onclick="setAccess('${x.id}','premium_30',30)">30 Hari</button><button class="btn g" onclick="setAccess('${x.id}','premium_year',365)">1 Tahun</button><button class="btn p" onclick="setAccess('${x.id}','lifetime',null)">Lifetime</button><button class="btn r" onclick="setAccess('${x.id}','demo',0)">Demo</button></div>
 </div>`).join(''):'<div class="empty">Belum ada pengguna.</div>'
}
async function setAccess(uid,plan,days){
 if(!confirm(`Ubah akses pengguna menjadi ${planLabel(plan)}?`))return;
 const {error}=await sb.rpc('modulkita_admin_set_access',{target_user:uid,new_plan:plan,days_count:days});if(error)return alert(error.message);loadAll()
}
async function setReq(id,status){
 const {error}=await sb.rpc('modulkita_admin_update_purchase_request',{req_id:id,new_status:status});if(error)return alert(error.message);loadRequests()
}
async function approve(id,uid,pkg){
 if(!confirm(`Setujui pembayaran dan aktifkan ${planLabel(pkg)}?`))return;
 let days=pkg==='premium_30'?30:pkg==='premium_year'?365:null;
 const {error:e1}=await sb.rpc('modulkita_admin_set_access',{target_user:uid,new_plan:pkg,days_count:days});if(e1)return alert(e1.message);
 const {error:e2}=await sb.rpc('modulkita_admin_update_purchase_request',{req_id:id,new_status:'approved'});if(e2)return alert(e2.message);
 alert('Pembayaran disetujui. Akses Premium sudah aktif.');loadAll()
}
async function logout(){await sb.auth.signOut();location.href='index.html'}
init()
</script>
</body></html>
